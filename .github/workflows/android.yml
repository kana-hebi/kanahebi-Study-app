name: Android study app

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: production
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate and test
        shell: bash
        run: |
          npm run typecheck
          npm run validate:content
          npm test
          npm run author:content
          git diff --exit-code -- content/organic-polymer.json content/math-check.study-pack.json docs/POLYMER_CONTENT_AUDIT.json docs/CURRICULUM.md
      - name: Install Android SDK components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Compile standalone arm64 APK
        run: npm run build:android
      - name: Inspect signature, manifest and bundled sources
        run: python scripts/inspect-apk.py
      - name: Create verified distribution
        run: python scripts/package-android.py
      - name: Retain verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kanahebi-study-android
          path: |
            artifacts/kanahebi-study-*-arm64.apk
            artifacts/kanahebi-study-*-android.zip
            artifacts/android-apk-validation.json
            artifacts/distribution.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
